<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Forest EDM - Shader Gallery</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161a;
            --accent: #00f2ff;
            --text: #e0e0e0;
            --text-dim: #909090;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00f2ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-dim);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1400px;
        }

        .shader-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .shader-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        canvas {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            background: #000;
            margin-bottom: 20px;
        }

        .info h3 {
            margin: 0 0 8px 0;
            color: var(--accent);
            font-size: 1.4rem;
        }

        .info p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .file-label {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 10px;
            background: rgba(0, 242, 255, 0.1);
            color: var(--accent);
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <h1>Magic Forest EDM</h1>
    <p class="subtitle">Galería Visual de Shaders Generativos</p>

    <div class="gallery" id="gallery"></div>

    <script id="vs" type="x-shader/x-vertex">
        attribute vec4 a_Position;
        attribute vec2 a_TexCoord;
        varying vec2 v_TexCoord;
        void main() {
            gl_Position = a_Position;
            v_TexCoord = a_TexCoord;
        }
    </script>

    <script>
        const SHADERS = [
            {
                name: "MagicRoots",
                file: "shader_organic_noise.glsl",
                desc: "Raíces de energía neón que se ramifican y pulsan rítmicamente.",
                fs: `precision mediump float;
                    varying vec2 v_TexCoord;
                    uniform float u_time;
                    uniform float u_opacity;
                    void main() {
                        float t = u_time * 0.5;
                        vec2 uv = (v_TexCoord - 0.5) * 6.0;
                        float dist = 0.0;
                        for(float i = 1.0; i < 4.0; i++) {
                            vec2 p = uv * i;
                            vec2 f = fract(p) - 0.5;
                            float d = length(f);
                            dist += 0.05 / (d + 0.02) * (1.0 / i);
                        }
                        vec3 col = 0.5 + 0.5*cos(t+vec3(0,2,4) + dist);
                        gl_FragColor = vec4(col * dist * 1.5, u_opacity * dist);
                    }`
            },
            {
                name: "LeafStorm",
                file: "shader_pulse_wave.glsl",
                desc: "Hojas girando en un torbellino psicodélico de colores forestales.",
                fs: `precision mediump float;
                    varying vec2 v_TexCoord;
                    uniform float u_time;
                    uniform float u_opacity;
                    void main() {
                        float t = u_time;
                        vec2 uv = (v_TexCoord - 0.5) * 5.0;
                        float dist = length(uv);
                        float angle = dist * 2.5 - t;
                        float s = sin(angle); float c = cos(angle);
                        uv = mat2(c, -s, s, c) * uv;
                        vec2 gv = fract(uv) - 0.5;
                        float m = smoothstep(0.15, 0.0, length(gv - vec2(0.3*sin(t), 0.3*cos(t)))) ;
                        vec3 col = mix(vec3(0.1, 0.8, 0.2), vec3(0.8, 0.4, 0.1), 0.5 + 0.5*sin(t + dist));
                        gl_FragColor = vec4(col, m * u_opacity);
                    }`
            },
            {
                name: "MysticFlora",
                file: "shader_aura_field.glsl",
                desc: "Flor fractal simétrica con bounce dinámico y luciérnagas.",
                fs: `precision mediump float;
                    varying vec2 v_TexCoord;
                    uniform float u_time;
                    uniform float u_opacity;
                    void main() {
                        float t = u_time;
                        vec2 center = vec2(sin(t*0.5)*0.2 + 0.5, cos(t*0.7)*0.2 + 0.5);
                        vec2 uv = (v_TexCoord - center) * 8.0;
                        float r = length(uv);
                        float a = atan(uv.y, uv.x);
                        float f = abs(cos(a*4.0 + t) * sin(a*3.0 - t));
                        float mask = smoothstep(f, f-0.1, r);
                        vec3 col = mix(vec3(0.8, 0.2, 1.0), vec3(0.0, 1.0, 1.0), 0.5 + 0.5*cos(r - t));
                        gl_FragColor = vec4(col * (mask + 0.1/(r+0.1)), u_opacity);
                    }`
            },
            {
                name: "CosmicPollen",
                file: "shader_particle_mist.glsl",
                desc: "Polen estelar que flota y brilla con destellos intermitentes.",
                fs: `precision mediump float;
                    varying vec2 v_TexCoord;
                    uniform float u_time;
                    uniform float u_opacity;
                    void main() {
                        float t = u_time * 0.8;
                        vec2 uv = v_TexCoord * 10.0;
                        vec2 gv = fract(uv) - 0.5;
                        vec2 id = floor(uv);
                        float h = fract(sin(dot(id, vec2(12.9, 78.2))) * 437.5);
                        float m = 0.02 / (length(gv - vec2(sin(t+h*6.2), cos(t*0.5+h*6.2))*0.4) + 0.02);
                        vec3 col = mix(vec3(1,0.9,0.2), vec3(0.2,1,0.5), h);
                        gl_FragColor = vec4(col * m * (0.5 + 0.5*sin(t*5.0+h*10.0)), m * u_opacity);
                    }`
            },
            {
                name: "FriendshipAura",
                file: "shader_dissolve_ritual.glsl",
                desc: "Metaballs de energía que fluyen y se conectan orgánicamente.",
                fs: `precision mediump float;
                    varying vec2 v_TexCoord;
                    uniform float u_time;
                    uniform float u_opacity;
                    void main() {
                        vec2 uv = (v_TexCoord - 0.5) * 2.0;
                        float t = u_time * 0.5;
                        float field = 0.0;
                        for(float i=0.0; i<4.0; i++) {
                            vec2 p = vec2(sin(t + i*1.5), cos(t*0.7 + i*2.2)) * 0.5;
                            field += 0.05 / (length(uv - p) + 0.02);
                        }
                        float edge = smoothstep(0.4, 0.5, field);
                        vec3 col = mix(vec3(1,0.2,0.5), vec3(0.2,0.5,1), 0.5 + 0.5*sin(field + t));
                        gl_FragColor = vec4(col * edge, edge * u_opacity);
                    }`
            },
            {
                name: "Fireworks",
                file: "shader_color_wash.glsl",
                desc: "Explosiones de partículas neón con efecto de gravedad y estelas.",
                fs: `precision mediump float;
                    varying vec2 v_TexCoord;
                    uniform float u_time;
                    uniform float u_opacity;
                    void main() {
                        float t = mod(u_time, 2.0);
                        vec2 uv = (v_TexCoord - 0.5) * 4.0;
                        float m = 0.0;
                        for(float i=0.0; i<12.0; i++) {
                            float a = i * 0.523;
                            vec2 p = vec2(cos(a), sin(a)) * t * 1.5;
                            p.y -= t * t * 0.2;
                            m += 0.005 / (length(uv - p) + 0.005) * (1.0 - t/2.0);
                        }
                        vec3 col = 0.5 + 0.5*cos(u_time + vec3(0,2,4));
                        gl_FragColor = vec4(col * m, m * u_opacity);
                    }`
            },
            {
                name: "FireEnergy",
                file: "shader_fire_energy.glsl",
                desc: "Llamas de energía forestal fluyendo hacia arriba.",
                fs: `precision mediump float;
                    varying vec2 v_TexCoord;
                    uniform float u_time;
                    uniform float u_opacity;
                    void main() {
                        vec2 uv = vec2(v_TexCoord.x, 1.0 - v_TexCoord.y) * 4.0;
                        uv.y -= u_time * 2.0;
                        float n = fract(sin(dot(floor(uv), vec2(12.9, 78.2))) * 437.5);
                        float fire = v_TexCoord.y * 1.5 + n * 0.5;
                        float m = smoothstep(0.4, 0.9, fire);
                        vec3 col = mix(vec3(0), vec3(1,0.5,0.2), m) + pow(fire, 3.0)*vec3(1,0.2,0);
                        gl_FragColor = vec4(col, m * u_opacity);
                    }`
            }
        ];

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function initRenderer(canvas, fsSource) {
            const gl = canvas.getContext('webgl');
            const vsSource = document.getElementById('vs').text;
            const program = gl.createProgram();
            gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
            gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
            gl.linkProgram(program);

            const positions = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

            const posLoc = gl.getAttribLocation(program, 'a_Position');
            const texLoc = gl.getAttribLocation(program, 'a_TexCoord');
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            const texCoords = new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]);
            const texBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, texBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, texCoords, gl.STATIC_DRAW);
            gl.enableVertexAttribArray(texLoc);
            gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 0, 0);

            const timeLoc = gl.getUniformLocation(program, 'u_time');
            const opacityLoc = gl.getUniformLocation(program, 'u_opacity');

            return function render(now) {
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.useProgram(program);
                gl.uniform1f(timeLoc, now * 0.001);
                gl.uniform1f(opacityLoc, 1.0);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            };
        }

        const gallery = document.getElementById('gallery');
        SHADERS.forEach(s => {
            const card = document.createElement('div');
            card.className = 'shader-card';
            card.innerHTML = `
                <canvas id="canvas-${s.name}"></canvas>
                <div class="info">
                    <h3>${s.name}</h3>
                    <p>${s.desc}</p>
                    <span class="file-label">${s.file}</span>
                </div>
            `;
            gallery.appendChild(card);
            const render = initRenderer(document.getElementById(`canvas-${s.name}`), s.fs);
            requestAnimationFrame(render);
        });
    </script>
</body>

</html>
