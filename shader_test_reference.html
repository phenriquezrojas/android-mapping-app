<!DOCTYPE html>
<html>

<head>
    <title>Magic Forest Shader Gallery</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .shader-card {
            background: #222;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #333;
        }

        canvas {
            width: 280px;
            height: 280px;
            border-radius: 8px;
            background: #000;
            margin-bottom: 10px;
        }

        h3 {
            margin: 5px 0;
            color: #0ff;
        }

        p {
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Magic Forest EDM Shader Set</h1>
    <div class="gallery" id="gallery"></div>

    <script>
        const VS_SOURCE = `
            attribute vec4 a_Position;
            attribute vec2 a_TexCoord;
            varying vec2 v_TexCoord;
            void main() {
                gl_Position = a_Position;
                v_TexCoord = a_TexCoord;
            }
        `;

        const SHADERS = [
            {
                name: "MagicRoots",
                fs: `precision mediump float;
                varying vec2 v_TexCoord;
                uniform float u_time;
                uniform float u_opacity;
                uniform float u_scale;
                uniform float u_speed;
                uniform float u_complexity;

                vec3 palette(float t) {
                    vec3 a = vec3(0.5, 0.5, 0.5);
                    vec3 b = vec3(0.5, 0.5, 0.5);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.263, 0.416, 0.557);
                    return a + b * cos(6.28318 * (c * t + d));
                }

                float hash(vec2 p) {
                    p = fract(p * vec2(123.34, 456.21));
                    p += dot(p, p + 45.32);
                    return fract(p.x * p.y);
                }

                void main() {
                    float t = u_time * (0.2 + u_speed);
                    vec2 uv = (v_TexCoord - 0.5) * (2.0 + u_scale * 15.0);
                    float dist = 0.0;
                    for(float i = 1.0; i < 4.0; i++) {
                        vec2 p = uv * i;
                        float h = hash(floor(p));
                        vec2 f = fract(p) - 0.5;
                        float d = length(f) * h;
                        dist += 0.05 / (d + 0.01) * (1.0 / i);
                    }
                    float pulse = sin(dist * 5.0 - t * 3.0) * 0.5 + 0.5;
                    vec3 color = palette(dist * 0.1 + t * 0.1);
                    float glow = smoothstep(0.1, 0.9, dist * (u_complexity + 0.5));
                    gl_FragColor = vec4(color * glow * (1.5 + pulse), glow * u_opacity);
                }`
            },
            {
                name: "FireEnergy",
                fs: `precision mediump float;
                varying vec2 v_TexCoord;
                uniform float u_time;
                uniform float u_opacity;
                uniform float u_intensity;
                uniform float u_flicker;
                uniform float u_flow;
                uniform float u_scale;

                float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
                float noise(vec2 p) {
                    vec2 i = floor(p); vec2 f = fract(p);
                    float a = hash(i); float b = hash(i + vec2(1.0, 0.0));
                    float c = hash(i + vec2(0.0, 1.0)); float d = hash(i + vec2(1.0, 1.0));
                    vec2 u = f * f * (3.0 - 2.0 * f);
                    return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
                }

                void main() {
                    float f = sin(u_time * 15.0) * 0.1 * u_flicker;
                    vec2 uv = vec2(v_TexCoord.x * (u_scale * 5.0 + 1.0), (1.0 - v_TexCoord.y) * 5.0);
                    uv.y -= u_time * (u_flow + 0.5);
                    float n = noise(uv) + 0.5 * noise(uv * 2.1);
                    float fire = v_TexCoord.y * (1.0 + u_intensity) + n * 0.5 + f;
                    float m = smoothstep(0.4, 0.9, fire);
                    vec3 col = mix(vec3(0.0), vec3(1.0, 0.3, 0.1), m) + vec3(1.0, 0.5, 0.2) * pow(fire, 3.0);
                    gl_FragColor = vec4(col, m * u_opacity);
                }`
            },
            {
                name: "LeafStorm",
                fs: `precision mediump float;
                varying vec2 v_TexCoord;
                uniform float u_time;
                uniform float u_opacity;
                uniform float u_speed;
                uniform float u_scale;
                uniform float u_energy;

                vec3 palette(float t) {
                    vec3 a = vec3(0.5, 0.5, 0.5);
                    vec3 b = vec3(0.5, 0.5, 0.5);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.0, 0.33, 0.67);
                    return a + b * cos(6.28318 * (c * t + d));
                }

                float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
                float leafShape(vec2 p, float size) {
                    p = abs(p);
                    vec2 p1 = p - vec2(0.5, 0.0) * size;
                    float d = length(p1) - size * 0.51;
                    return smoothstep(0.02, 0.0, d);
                }

                void main() {
                    float t = u_time * (u_speed + 0.5);
                    vec2 uv = (v_TexCoord - 0.5) * (1.0 + u_scale * 8.0);
                    float dist = length(uv);
                    float angle = dist * (2.0 + u_energy) - t;
                    float s = sin(angle); float c = cos(angle);
                    uv = mat2(c, -s, s, c) * uv;
                    vec2 gv = fract(uv) - 0.5; vec2 id = floor(uv); float h = hash(id);
                    gv += vec2(sin(t + h * 6.2), cos(t * 0.7 + h * 6.2)) * 0.3;
                    float m = leafShape(gv, 0.2 + h * 0.3);
                    vec3 col = mix(palette(h + t * 0.1), vec3(0.1, 0.8, 0.2), 0.5);
                    gl_FragColor = vec4(col, m * u_opacity);
                }`
            },
            {
                name: "CosmicPollen",
                fs: `precision mediump float;
                varying vec2 v_TexCoord;
                uniform float u_time;
                uniform float u_opacity;
                uniform float u_density;
                uniform float u_scale;
                uniform float u_flow;

                vec3 palette(float t) {
                    vec3 a = vec3(0.5, 0.5, 0.5);
                    vec3 b = vec3(0.5, 0.5, 0.5);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.8, 0.9, 0.3);
                    return a + b * cos(6.28318 * (c * t + d));
                }

                float hash(vec2 p) {
                    p = fract(p * vec2(123.34, 456.21));
                    p += dot(p, p + 45.32);
                    return fract(p.x * p.y);
                }

                void main() {
                    float t = u_time * (u_flow + 0.5);
                    vec2 uv = v_TexCoord * (3.0 + u_scale * 12.0);
                    vec2 gv = fract(uv) - 0.5; vec2 id = floor(uv);
                    float m = 0.0; vec3 finalCol = vec3(0.0);
                    for(float y=-1.0; y<=1.0; y++) {
                        for(float x=-1.0; x<=1.0; x++) {
                            vec2 offs = vec2(x, y); float h = hash(id + offs);
                            vec2 p = offs + vec2(sin(t + h * 6.2), cos(t * 0.5 + h * 6.2)) * 0.4;
                            float d = length(gv - p);
                            float sp = sin(t * 5.0 + h * 10.0) * 0.5 + 0.5;
                            float glow = 0.02 / (d + 0.02) * sp;
                            m += glow * h; finalCol += palette(h + t * 0.1) * glow;
                        }
                    }
                    gl_FragColor = vec4(finalCol * (u_density * 2.0 + 1.0), m * u_opacity);
                }`
            },
            {
                name: "FriendshipAura",
                fs: `precision mediump float;
                varying vec2 v_TexCoord;
                uniform float u_time;
                uniform float u_opacity;
                uniform float u_progress;
                uniform float u_scale;

                vec3 palette(float t) {
                    vec3 a = vec3(0.5, 0.5, 0.5);
                    vec3 b = vec3(0.5, 0.5, 0.5);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.5, 0.2, 0.25);
                    return a + b * cos(6.28318 * (c * t + d));
                }

                void main() {
                    vec2 uv = (v_TexCoord - 0.5) * (1.0 + u_scale * 5.0);
                    float t = u_time * 0.5;
                    float field = 0.0;
                    for(float i=0.0; i<4.0; i++) {
                        vec2 p = vec2(sin(t + i * 1.5), cos(t * 0.7 + i * 2.2)) * 0.4;
                        field += 0.05 / (length(uv - p) + 0.02);
                    }
                    float mask = smoothstep(u_progress * 10.0, 10.0 * u_progress + 0.1, field);
                    float edge = smoothstep(u_progress * 10.0 - 1.0, u_progress * 10.0, field);
                    vec3 col = palette(field * 0.1 + t) + vec3(1.0, 1.0, 1.0) * (edge - mask);
                    gl_FragColor = vec4(col * edge, edge * u_opacity);
                }`
            },
            {
                name: "Fireworks",
                fs: `precision mediump float;
                varying vec2 v_TexCoord;
                uniform float u_time;
                uniform float u_opacity;
                uniform float u_speed;
                uniform float u_scale;

                vec3 palette(float t) {
                    vec3 a = vec3(0.5, 0.5, 0.5);
                    vec3 b = vec3(0.5, 0.5, 0.5);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.1, 0.5, 0.8);
                    return a + b * cos(6.28318 * (c * t + d));
                }
                float hash(float n) { return fract(sin(n) * 43758.5453123); }

                void main() {
                    float t = u_time * (u_speed + 0.5);
                    vec2 uv = (v_TexCoord - 0.5) * (1.0 + u_scale * 5.0);
                    vec3 finalCol = vec3(0.0); float alpha = 0.0;
                    for(float i=0.0; i<5.0; i++) {
                        float h = hash(i + 123.45); float cycle = mod(t - h * 5.0, 3.0);
                        if(cycle < 2.0 && cycle > 0.0) {
                            float burstSize = cycle * (1.0 + h);
                            float fade = 1.0 - (cycle / 2.0);
                            for(float j=0.0; j<12.0; j++) {
                                float angle = j * 0.523 + h * 6.28;
                                vec2 p = vec2(cos(angle), sin(angle)) * burstSize;
                                p.y -= cycle * cycle * 0.1;
                                float d = length(uv - p);
                                float sparkle = 0.005 / (d + 0.005);
                                finalCol += palette(h + i * 0.1) * sparkle * fade * 2.0;
                                alpha = max(alpha, sparkle * fade);
                            }
                        }
                    }
                    gl_FragColor = vec4(finalCol, alpha * u_opacity);
                }`
            }
        ];

        function initShader(gl, fsSource) {
            const vs = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vs, VS_SOURCE); gl.compileShader(vs);
            const fs = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fs, fsSource); gl.compileShader(fs);
            const program = gl.createProgram();
            gl.attachShader(program, vs); gl.attachShader(program, fs);
            gl.linkProgram(program);
            return program;
        }

        const gallery = document.getElementById('gallery');
        SHADERS.forEach(s => {
            const card = document.createElement('div');
            card.className = 'shader-card';
            card.innerHTML = `<h3>\${s.name}</h3><canvas id="canvas-\${s.name}"></canvas><p>Referencia de forma y color</p>`;
            gallery.appendChild(card);

            const canvas = document.getElementById(`canvas-\${s.name}`);
            const gl = canvas.getContext('webgl');
            const program = initShader(gl, s.fs);
            gl.useProgram(program);

            const positions = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
            const posBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
            const posLoc = gl.getAttribLocation(program, 'a_Position');
            gl.enableVertexAttribArray(posLoc); gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            const texCoords = new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]);
            const texBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, texBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, texCoords, gl.STATIC_DRAW);
            const texLoc = gl.getAttribLocation(program, 'a_TexCoord');
            gl.enableVertexAttribArray(texLoc); gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 0, 0);

            const timeLoc = gl.getUniformLocation(program, 'u_time');
            const opacityLoc = gl.getUniformLocation(program, 'u_opacity');
            const flowLoc = gl.getUniformLocation(program, 'u_flow');
            const scaleLoc = gl.getUniformLocation(program, 'u_scale');
            const speedLoc = gl.getUniformLocation(program, 'u_speed');
            const complexityLoc = gl.getUniformLocation(program, 'u_complexity');
            const intensityLoc = gl.getUniformLocation(program, 'u_intensity');
            const flickerLoc = gl.getUniformLocation(program, 'u_flicker');
            const energyLoc = gl.getUniformLocation(program, 'u_energy');
            const densityLoc = gl.getUniformLocation(program, 'u_density');
            const progressLoc = gl.getUniformLocation(program, 'u_progress');

            function render(now) {
                gl.useProgram(program);
                gl.uniform1f(timeLoc, now * 0.001);
                gl.uniform1f(opacityLoc, 1.0);
                if (flowLoc) gl.uniform1f(flowLoc, 0.5);
                if (scaleLoc) gl.uniform1f(scaleLoc, 0.5);
                if (speedLoc) gl.uniform1f(speedLoc, 0.5);
                if (complexityLoc) gl.uniform1f(complexityLoc, 0.5);
                if (intensityLoc) gl.uniform1f(intensityLoc, 0.5);
                if (flickerLoc) gl.uniform1f(flickerLoc, 0.5);
                if (energyLoc) gl.uniform1f(energyLoc, 0.5);
                if (densityLoc) gl.uniform1f(densityLoc, 0.5);
                if (progressLoc) gl.uniform1f(progressLoc, 0.5);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        });
    </script>
</body>

</html>
