
<!DOCTYPE html>
<html>
<head>
  <title>ShaderKit - Shader Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin: 0; overflow: hidden; background-color: #2c3e50; font-family: Arial, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
    .modal {
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
    }
    .modal-content {
      width: 300px;
    }
    .modal-header {
      cursor: move;
      padding: 5px;
      background-color: rgba(255, 255, 255, 0.1);
      margin-bottom: 5px;
    }
    .modal-footer {
      padding: 5px;
    }
    #channelSelectContainer {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 1px;
    }
    #channelSelectContainer select {
      width: 45%;
    }
    .uniform {
      margin-bottom: -8px;
    }
    .uniform input[type="range"] {
      width: 80%;
    }
    .uniform input[type="number"] {
      width: 40px;
      -moz-appearance: textfield;
      -webkit-appearance: textfield;
    }
  </style>

  <script>
    const shaderData = {"channels":{"iChannel0":"vec3 c1(vec2 uv, float t, float ii) {\n    vec3 col = vec3(0.0);\n    vec3 db = vec3(0.);\n    //uv = fract(uv*2.)-0.5;\n    uv *= 0.5;\n    //uv *= r2d(deg*45.);\n    //uv = uv/dot(uv,uv);\n    //uv += sin(sin(uv*0.5))*4.;\n    //uv += sin(sin(uv));\n    //uv += sin(sin(uv/pi)+time*3.)\n    //uv *= r2d(deg*45.);\n    for (int i=0;i<5;i++) {\n        //uv *= 1.5;\n        //uv += sin(uv.yx*1.05)*1.1*sin(t+float(i));\n        //uv *= r2d(deg*90.);\n    }\n    //uv *= 0.1*1.;\n    //uv *= r2d(deg*45.);\n    //db.rg += sin(cos(uv)+t*8.);\n    //uv *= 1.+sin(uv+t);\n    //uv = uv/dot(uv,uv);\n    //uv = fract(uv*2.)-0.5;\n    //uv *= 0.8;\n    //uv *= r2d(deg*45.);\n    uv = abs(uv)*2.;\n    uv *= r2d(deg*45.);\n    uv = abs(uv)-0.2;\n    //uv.y = abs(uv.y)-0.415;\n    //uv.y = -abs(uv.y)+0.21;\n    //uv = abs(uv)-0.25;\n    //uv = abs(uv)-0.125;\n    uv *= r2d(t);\n    // Chevrons >>>>> row\n    float chevSpacing = 0.1+cos(t+uv.x)*0.05;\n    float dChev = sdChevrons(uv, vec2(-0.6, 0.15), vec2(0.6, 0.15), 0.1+cos(t+uv.x)*0.05, 0.04+sin(t*2.+uv.x)*0.02, 0.003, pi * 0.25+sin(uv.x*4.+t*3.)*0.15);\n    float chevId = floor((dot(uv - vec2(-0.6, 0.15), normalize(vec2(1.2, 0.0)))) / chevSpacing);\n    vec3 colChev = palette(t+ii + chevId * 0.15, vec3(0.5), vec3(0.5), vec3(1.0, 1.0, 0.5), vec3(0.0, 0.1, 0.2));\n    //colChev \n    col = mix(colChev, col, smoothstep(0.0, 0.003, dChev));\n\n    // Dots ..... row\n    float dotSpacing = 0.06+sin(t+uv.x)*0.1+0.1;\n    float dDot = sdDots(uv, vec2(-0.6, 0.05), vec2(0.6, 0.05), dotSpacing, 0.015);\n    float dotId = floor(dot(uv - vec2(-0.6, 0.05), normalize(vec2(1.2, 0.0))) / dotSpacing + 0.5);\n    vec3 colDot = palette(t+ii + dotId * 0.2 + 1.0, vec3(0.5), vec3(0.5), vec3(1.0, 1.0, 1.0), vec3(0.3, 0.2, 0.2));\n    col = mix(colDot, col, smoothstep(0.0, 0.003, dDot));\n\n    // Dashes ----- row\n    float dDash = sdDashes(uv, vec2(-0.6, -0.05), vec2(0.6, -0.05), 0.1, 0.06+sin(t+uv.x)*0.03, 0.006);\n    float dashId = floor(dot(uv - vec2(-0.6, -0.05), normalize(vec2(1.2, 0.0))) / 0.1);\n    vec3 colDash = paletteNeon(t+ii + dashId * 0.18 + 2.0);\n    col = mix(colDash, col, smoothstep(0.0, 0.003, dDash));\n\n    // Boxes row\n    float dBox = sdBoxes(uv, vec2(-0.6, -0.15), vec2(0.6, -0.15), 0.12, vec2(0.025, 0.025)+sin(t+uv.x)*0.015, 0.004);\n    float boxId = floor(dot(uv - vec2(-0.6, -0.15), normalize(vec2(1.2, 0.0))) / 0.12);\n    vec3 colBox = palette(t+ii + boxId * 0.22 + 3.0, vec3(0.5), vec3(0.5), vec3(1.0, 1.0, 1.0), vec3(0.8, 0.9, 0.3));\n    col = mix(colBox, col, smoothstep(0.0, 0.003, dBox));\n    //col += db;\n    return col;\n}\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    vec2 uv = fragCoord.xy / iResolution.xy;\n    uv -= 0.5;\n    uv.x *= ar;\n    vec3 col = c1(uv,time*0.,0.)*0.;\n    float s = 1.;\n    for (int i=0;i<34;i++) {\n        float ii = float(i);\n        float fi = fract(ii/34.+time/pi/2.);\n        float f2 = fract(ii/34.+time/pi/2.+0.5);\n        float afi = abs(fi-0.5)*2.;\n        float af2 = abs(f2-0.5)*2.;\n        float nfi = 1.-fi;\n        float nf2 = 1.-f2;\n        float naf2 = 1.-af2;\n        float nafi = 1.-afi;\n        vec2 av = uv;\n        float ac = length(av);\n        av = (fract(av*s-0.5)-0.5)/s;\n        //av = abs(av);\n        uv *= 1.05+cos(time/4.+afi*1.5+2.)*0.05;\n        for (int j=0;j<6;j++) {\n            av = abs(av)-0.5;\n            av = abs(av)-0.05;\n            //av *= r2d(deg*45.);\n            av *= 0.95;\n            av += sin(av.yx*(15.-ii/3.))*0.03*sin(float(j)*pi/2.+time)*pow(nf2,4.);\n            //av *= r2d(sin(time/8.+float(j)*pi/2.)*pi+float(j)*pi/2.);\n            //av = abs(av)-0.0;\n            \n            //av += sin(av*20.)*0.05*sin(float(j)*pi/2.+time)*pow(nf2,1.);\n        }\n        av *= 2.+sin(time+ii*0.05)*1.5;\n        //uv *= r2d(sin(time+ii*pi/2.)*deg*200.);\n        //uv *= r2d(deg*45.);\n        //av += sin(uv*14.+ii/pi/3.)*nf2*0.1;\n        //av *= r2d(deg*45.);\n        //av += sin(av.yx*14.+ii/pi/3.)*pow(nf2,4.)*0.1;\n        //av *= r2d(deg*-45.);\n        vec3 c = c1(av,time*0.5+ii*0.04,ii/34.)*afi;\n        col += c/3.2;\n    }\n\n    fragColor = vec4(col, 1.0);\n}","displayMode":"void mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    vec2 uv = fragCoord.xy / iResolution.xy;\n    vec3 col = texture(iChannel0, uv).rgb;\n    fragColor = vec4(col, 1.);\n}"},"uniforms":[],"commonCode":"#define pi acos(-1.)\n#define deg pi/180.  //1 degree\n#define time iTime*2.*pi/20. //sin(time) loops 10 seconds\n#define R iResolution.xy //shorthand\n#define ar R.x/R.y //aspect ratio\n#define M iMouse //shorthand\n#define xm (M.xy/R) //normalized mouse\n#define nm ((xm.xy-0.5)*vec2(ar,1.)+0.5) //aspect ratio correction\nvec3 cs = vec3(1.,2.,3.);\nmat2 r2d(float a) {\n    return mat2(cos(a),sin(a),-sin(a),cos(a));\n}\n\nvec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {\n    return a + b * cos(6.28318 * (c * t + d));\n}\n\nvec3 paletteNeon(float t) {\n    return palette(t, vec3(0.5, 0.5, 0.5), vec3(0.5, 0.5, 0.5), vec3(1.0, 1.0, 1.0), vec3(0.0, 0.5, 0.5));\n}\n\nfloat sdBox(in vec2 p, in vec2 b) {\n    vec2 d = abs(p)-b;\n    return length(max(d,0.0)) + min(max(d.x,d.y),0.0);\n}\n\nfloat sdSegment(in vec2 p, in vec2 a, in vec2 b) {\n    vec2 pa = p-a, ba = b-a;\n    float h = clamp( dot(pa,ba)/dot(ba,ba), 0.0, 1.0 );\n    return length( pa - ba*h );\n}\n\n// Repeating chevrons >>>>> along a line segment direction\n// p: point, a/b: segment endpoints, spacing: distance between chevrons,\n// size: chevron arm length, thick: line thickness, angle: chevron half-angle\nfloat sdChevrons(vec2 p, vec2 a, vec2 b, float spacing, float size, float thick, float angle) {\n    vec2 ba = b - a;\n    float len = length(ba);\n    vec2 dir = ba / len;\n    vec2 perp = vec2(-dir.y, dir.x);\n    // Project p onto the line\n    vec2 pa = p - a;\n    float along = dot(pa, dir);\n    float across = dot(pa, perp);\n    // Repeat along the line\n    float cell = mod(along, spacing) - spacing * 0.5;\n    // Two arms of the chevron: angled lines\n    float sa = sin(angle), ca = cos(angle);\n    // Arm 1: going up-right\n    vec2 q = vec2(cell, across);\n    float d1 = sdSegment(q, vec2(0.0), vec2(-size * ca, size * sa));\n    // Arm 2: going down-right\n    float d2 = sdSegment(q, vec2(0.0), vec2(-size * ca, -size * sa));\n    float d = min(d1, d2) - thick;\n    // Mask to segment range\n    float mask = step(0.0, along) * step(along, len);\n    return mix(1e5, d, mask);\n}\n\n// Repeating dots ..... along a line segment\n// p: point, a/b: segment endpoints, spacing: distance between dots, radius: dot radius\nfloat sdDots(vec2 p, vec2 a, vec2 b, float spacing, float radius) {\n    vec2 ba = b - a;\n    float len = length(ba);\n    vec2 dir = ba / len;\n    vec2 perp = vec2(-dir.y, dir.x);\n    vec2 pa = p - a;\n    float along = dot(pa, dir);\n    float across = dot(pa, perp);\n    // Snap to nearest dot center\n    float cell = along / spacing;\n    float nearest = (clamp(floor(cell + 0.5), 0.0, floor(len / spacing)) ) * spacing;\n    float dx = along - nearest;\n    return length(vec2(dx, across)) - radius;\n}\n\n// Repeating dashes ----- along a line segment\n// p: point, a/b: segment endpoints, spacing: total period, dashLen: length of each dash, thick: half-thickness\nfloat sdDashes(vec2 p, vec2 a, vec2 b, float spacing, float dashLen, float thick) {\n    vec2 ba = b - a;\n    float len = length(ba);\n    vec2 dir = ba / len;\n    vec2 perp = vec2(-dir.y, dir.x);\n    vec2 pa = p - a;\n    float along = dot(pa, dir);\n    float across = dot(pa, perp);\n    // Repeat\n    float cell = mod(along, spacing) - spacing * 0.5;\n    // Box for each dash\n    vec2 q = vec2(cell, across);\n    float d = sdBox(q, vec2(dashLen * 0.5, thick));\n    float mask = step(0.0, along) * step(along, len);\n    return mix(1e5, d, mask);\n}\n\n// Repeating boxes along a line segment\n// p: point, a/b: segment endpoints, spacing: period, boxSize: half-extents of each box, thick: outline thickness (0 = filled)\nfloat sdBoxes(vec2 p, vec2 a, vec2 b, float spacing, vec2 boxSize, float thick) {\n    vec2 ba = b - a;\n    float len = length(ba);\n    vec2 dir = ba / len;\n    vec2 perp = vec2(-dir.y, dir.x);\n    vec2 pa = p - a;\n    float along = dot(pa, dir);\n    float across = dot(pa, perp);\n    float cell = mod(along, spacing) - spacing * 0.5;\n    vec2 q = vec2(cell, across);\n    float d = sdBox(q, boxSize);\n    if (thick > 0.0) d = abs(d) - thick;\n    float mask = step(0.0, along) * step(along, len);\n    return mix(1e5, d, mask);\n}\n","displayCode":"Not used","availableChannels":["iChannel0"],"thumbnailUrl":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAYAAAA8AXHiAAAQAElEQVR4Aez89Xts2Xmtgb4FKklVYmbmLW3UZuZmJnfbbeYYYsc+cZyYEts5dmKIoWPsbne77WaGzbs3M0lbzMxcKqlUcOdYfe6fcH+7Oc989uq15vzmN94xtGrVqpPYP/EPvw6/9NTXwyeufSj8tx/dGf7y3XeGX/3OR8JvPrMv/PFPPxJ+/Mt3hH/y3VvDP/63n4U/dtdPw/f8+snw6nteDH/6J/8S/sULPw9/5gfV4V+++1j4iXc+HH765I/C5ye+Gb4Rfjr8/uz/Cb/y52XhS2/cHZ7v/0T4P3r+K9wQ/m3YH+4IL4ZPhVt9T4XbJ34X/o9/+4fwJ/7x8+Etq5LCD95dHF5fdUd4c96XwytzvxHevuYfwt9d+1T4sw8fDP/jj5vDG+8/H77tI98L3/+ld8N/fmI0/NQLPwn/7I8/Ch94547w95v/N/y1az8MT4f/TzgUfi7sX2oI3xwOh3/19/5wIKz/6QrPB8wIe8Pf/slL4W/+8lj4tauvho+1vBMeCgfDf3t2KPxmfUf4Q58/FN727dPhH333J+Gaez4brvi/Xwuv/ekfw/d+5dfW0LHO6ZrmaK7WaK1qqJZqqrb20F7zZk/tHQ53Wr2op/rhsNWjelXP6l0apEWapE0apVWapV0MxEJMxGalYSRWYiZ2YiiWYiq2YrxoWIu52MsDeSFP5I08uhF+2vJM3slDeSlP5a08ltfyXN4rAz8xWVAmlA1lRFlRZv5msqMMKUvKlP222k7+/E4/z/49yO8vBbn7tgDt/l2cntqNPTqOdPsQvvgAMwsvkVoVzYer4rn3oUY2FIdo630XpycGvy8Ff80DuCrs/ODP/fSefpLml0/z0X/088gfMni1z8MjUbVUUoxzbhxX+Dxtvou81znDim/t4gu3d7NzawLh0VFss/M4WSS8tIqY4Y3UR47ijX+Kg0e+AvYnmV8qxx0zyI1wPa7Y2+i2uznQVUJkSx2xnXX85olZxrlEhDORqrQx/uFhL6HAJb75Fwczk/mcb+4mYJvDO3WKl0/5aL3az2xdP7VbUsktLGBm4C1Sxl7kFftaPHfew8jxBgYu9jLb0m0NHeucrmmO5mqN1qqGaqmmamsP7aU9p83e3/yL0/Ry2eppWdoo6lG9qmf1Lg3SIk0uo00apVWapV0MxEJMxEaMxErMxE4MxVJMxVaMxVrMxV4eWF4YT+SNPJJ     const canvas = document.getElementById('canvas');
    
    function main() {
      const gl = canvas.getContext('webgl2');

      if (!gl) {
        alert('WebGL 2 not supported');
        return;
      }

      // Enable required extensions
      gl.getExtension('EXT_color_buffer_float');
      gl.getExtension('OES_texture_float_linear');

      const vertexShaderSource = `#version 300 es
        in vec4 position;
        void main() {
          gl_Position = position;
        }
      `;

      function getFragmentShaderSource(channel) {
        return `#version 300 es
          precision highp float;
          uniform vec2 iResolution;
          uniform float iTime;
          uniform int iFrame;
          uniform vec4 iMouse;
          uniform sampler2D iChannel0;\nuniform sampler2D displayMode;
          
          out vec4 fragColor;
          void mainImage(out vec4 fragColor, in vec2 fragCoord);
          #define pi acos(-1.)
#define deg pi/180.  //1 degree
#define time iTime*2.*pi/20. //sin(time) loops 10 seconds
#define R iResolution.xy //shorthand
#define ar R.x/R.y //aspect ratio
#define M iMouse //shorthand
#define xm (M.xy/R) //normalized mouse
#define nm ((xm.xy-0.5)*vec2(ar,1.)+0.5) //aspect ratio correction
vec3 cs = vec3(1.,2.,3.);
mat2 r2d(float a) {
    return mat2(cos(a),sin(a),-sin(a),cos(a));
}

vec3 palette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
    return a + b * cos(6.28318 * (c * t + d));
}

vec3 paletteNeon(float t) {
    return palette(t, vec3(0.5, 0.5, 0.5), vec3(0.5, 0.5, 0.5), vec3(1.0, 1.0, 1.0), vec3(0.0, 0.5, 0.5));
}

float sdBox(in vec2 p, in vec2 b) {
    vec2 d = abs(p)-b;
    return length(max(d,0.0)) + min(max(d.x,d.y),0.0);
}

float sdSegment(in vec2 p, in vec2 a, in vec2 b) {
    vec2 pa = p-a, ba = b-a;
    float h = clamp( dot(pa,ba)/dot(ba,ba), 0.0, 1.0 );
    return length( pa - ba*h );
}

// Repeating chevrons >>>>> along a line segment direction
// p: point, a/b: segment endpoints, spacing: distance between chevrons,
// size: chevron arm length, thick: line thickness, angle: chevron half-angle
float sdChevrons(vec2 p, vec2 a, vec2 b, float spacing, float size, float thick, float angle) {
    vec2 ba = b - a;
    float len = length(ba);
    vec2 dir = ba / len;
    vec2 perp = vec2(-dir.y, dir.x);
    // Project p onto the line
    vec2 pa = p - a;
    float along = dot(pa, dir);
    float across = dot(pa, perp);
    // Repeat along the line
    float cell = mod(along, spacing) - spacing * 0.5;
    // Two arms of the chevron: angled lines
    float sa = sin(angle), ca = cos(angle);
    // Arm 1: going up-right
    vec2 q = vec2(cell, across);
    float d1 = sdSegment(q, vec2(0.0), vec2(-size * ca, size * sa));
    // Arm 2: going down-right
    float d2 = sdSegment(q, vec2(0.0), vec2(-size * ca, -size * sa));
    float d = min(d1, d2) - thick;
    // Mask to segment range
    float mask = step(0.0, along) * step(along, len);
    return mix(1e5, d, mask);
}

// Repeating dots ..... along a line segment
// p: point, a/b: segment endpoints, spacing: distance between dots, radius: dot radius
float sdDots(vec2 p, vec2 a, vec2 b, float spacing, float radius) {
    vec2 ba = b - a;
    float len = length(ba);
    vec2 dir = ba / len;
    vec2 perp = vec2(-dir.y, dir.x);
    vec2 pa = p - a;
    float along = dot(pa, dir);
    float across = dot(pa, perp);
    // Snap to nearest dot center
    float cell = along / spacing;
    float nearest = (clamp(floor(cell + 0.5), 0.0, floor(len / spacing)) ) * spacing;
    float dx = along - nearest;
    return length(vec2(dx, across)) - radius;
}

// Repeating dashes ----- along a line segment
// p: point, a/b: segment endpoints, spacing: total period, dashLen: length of each dash, thick: half-thickness
float sdDashes(vec2 p, vec2 a, vec2 b, float spacing, float dashLen, float thick) {
    vec2 ba = b - a;
    float len = length(ba);
    vec2 dir = ba / len;
    vec2 perp = vec2(-dir.y, dir.x);
    vec2 pa = p - a;
    float along = dot(pa, dir);
    float across = dot(pa, perp);
    // Repeat
    float cell = mod(along, spacing) - spacing * 0.5;
    // Box for each dash
    vec2 q = vec2(cell, across);
    float d = sdBox(q, vec2(dashLen * 0.5, thick));
    float mask = step(0.0, along) * step(along, len);
    return mix(1e5, d, mask);
}

// Repeating boxes along a line segment
// p: point, a/b: segment endpoints, spacing: period, boxSize: half-extents of each box, thick: outline thickness (0 = filled)
float sdBoxes(vec2 p, vec2 a, vec2 b, float spacing, vec2 boxSize, float thick) {
    vec2 ba = b - a;
    float len = length(ba);
    vec2 dir = ba / len;
    vec2 perp = vec2(-dir.y, dir.x);
    vec2 pa = p - a;
    float along = dot(pa, dir);
    float across = dot(pa, perp);
    float cell = mod(along, spacing) - spacing * 0.5;
    vec2 q = vec2(cell, across);
    float d = sdBox(q, boxSize);
    if (thick > 0.0) d = abs(d) - thick;
    float mask = step(0.0, along) * step(along, len);
    return mix(1e5, d, mask);
}

          void main() {
            mainImage(fragColor, gl_FragCoord.xy);
          }
          ${shaderData.channels[channel]}
        `;
      }

      function compileShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      function createProgram(gl, vertexShader, fragmentShader) {
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error('Program linking error:', gl.getProgramInfoLog(program));
          gl.deleteProgram(program);
          return null;
        }
        return program;
      }

      const vertexShader = compileShader(gl, gl.VERTEX_SHADER, vertexShaderSource);

      const programs = {};
      Object.keys(shaderData.channels).forEach(channel => {
        const fragmentShaderSource = getFragmentShaderSource(channel);
        const fragmentShader = compileShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
        programs[channel] = createProgram(gl, vertexShader, fragmentShader);
      });

      const positionBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

      const framebuffers = {};
      const textures = {};

      function createFramebufferTexture(width, height) {
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, width, height, 0, gl.RGBA, gl.FLOAT, null);
        // Use shader data texture filtering settings (from embedded shaderData)
        const magFilter = (shaderData.magFilter === 'NEAREST') ? gl.NEAREST : gl.LINEAR;
        const minFilter = (shaderData.minFilter === 'NEAREST') ? gl.NEAREST : gl.LINEAR;
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, minFilter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, magFilter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        
        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        if (status !== gl.FRAMEBUFFER_COMPLETE) {
          console.error('Framebuffer is not complete:', status);
        }
        
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return { texture, framebuffer: fb };
      }

      // Use scale from shader data (defaults to 1 for older exports)
      const resolutionScale = shaderData.resolutionScale || 1;
      let lastWidth = 0;
      let lastHeight = 0;

      function resizeCanvasToDisplaySize(canvas) {
        const displayWidth = Math.floor(canvas.clientWidth * window.devicePixelRatio * resolutionScale);
        const displayHeight = Math.floor(canvas.clientHeight * window.devicePixelRatio * resolutionScale);
        const needResize = canvas.width !== displayWidth || canvas.height !== displayHeight;
        if (needResize) {
            canvas.width = displayWidth;
            canvas.height = displayHeight;
            lastWidth = displayWidth;
            lastHeight = displayHeight;
          }
          return needResize;
      }

      function updateFramebuffers() {
        Object.keys(shaderData.channels).forEach(channel => {
          framebuffers[channel] = [
            createFramebufferTexture(canvas.width, canvas.height),
            createFramebufferTexture(canvas.width, canvas.height)
          ];
          textures[channel] = framebuffers[channel].map(fb => fb.texture);
        });
      }

      let currentBufferIndex = 0;
      let iFrame = 0;
      let iMouse = [0.0, 0.0, 0.0, 0.0];

      function render(time) {
        // Check if resize is needed and update framebuffers if so
        if (resizeCanvasToDisplaySize(canvas)) {
          updateFramebuffers();
          // Reset buffer index on resize to prevent drift
          currentBufferIndex = 0;
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
        
        Object.keys(shaderData.channels).forEach(channel => {
          const program = programs[channel];
          if (!program) return;
          
          gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffers[channel][1 - currentBufferIndex].framebuffer);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.useProgram(program);
          
          setUniforms(program, time);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        });

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.clear(gl.COLOR_BUFFER_BIT);
        const displayModeProgram = programs.displayMode;
        gl.useProgram(displayModeProgram);
        
        setUniforms(displayModeProgram, time);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        iFrame++;
        currentBufferIndex = 1 - currentBufferIndex;
        requestAnimationFrame(render);
      }

      function setUniforms(program, time) {
        gl.uniform2f(gl.getUniformLocation(program, 'iResolution'), canvas.width, canvas.height);
        gl.uniform1f(gl.getUniformLocation(program, 'iTime'), time * 0.001);
        gl.uniform1i(gl.getUniformLocation(program, 'iFrame'), iFrame);
        gl.uniform4f(gl.getUniformLocation(program, 'iMouse'), iMouse[0], iMouse[1], iMouse[2], iMouse[3]);
        
        Object.keys(shaderData.channels).forEach((channel, index) => {
          const loc = gl.getUniformLocation(program, channel);
          if (loc !== null) {
            gl.uniform1i(loc, index);
            gl.activeTexture(gl.TEXTURE0 + index);
            gl.bindTexture(gl.TEXTURE_2D, textures[channel][currentBufferIndex]);
          }
        });
        
        shaderData.uniforms.forEach(uniform => {
          const loc = gl.getUniformLocation(program, uniform.name);
          if (loc !== null) {
            gl.uniform1f(loc, uniform.value);
          }
        });
      }

      const positionAttributeLocation = gl.getAttribLocation(programs.displayMode, 'position');
      gl.enableVertexAttribArray(positionAttributeLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionAttributeLocation, 2, gl.FLOAT, false, 0, 0);

      updateFramebuffers();
      requestAnimationFrame(render);

      // Initial setup - render loop handles resize
      resizeCanvasToDisplaySize(canvas);
      updateFramebuffers();

      // Function to update modal uniform list
      function updateModalUniformList() {
        const modalUniformList = document.getElementById('modalUniformList');
        modalUniformList.innerHTML = '';
        const uniformsModal = document.getElementById('uniformsModal');
        if (shaderData.uniforms.length > 0) {
          uniformsModal.style.display = 'block';
        }
        shaderData.uniforms.forEach((uniform, index) => {
          const uniformDiv = document.createElement('div');
          uniformDiv.classList.add('uniform');
          // Security: HTML escaping function to prevent XSS
          function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
          }
          
          // Security: Escape uniform name and value to prevent XSS
          const escapedName = escapeHtml(String(uniform.name || ''));
          const escapedValue = escapeHtml(String(uniform.value || 0));
          uniformDiv.innerHTML = `
            <span style="padding-right: 200px;">${escapedName}</span>
            <input type="range" min="-20" max="20" step="0.1" value="${escapedValue}" oninput="updateUniformValue(${index}, this.value)">
            <input type="number" min="-20" max="20" step="0.1" value="${escapedValue}" oninput="updateUniformValue(${index}, this.value)">
          `;
          modalUniformList.appendChild(uniformDiv);

          const rangeInput = uniformDiv.querySelector('input[type="range"]');
          const numberInput = uniformDiv.querySelector('input[type="number"]');

          // Add wheel event listeners
          rangeInput.addEventListener('wheel', (e) => handleWheel(e, index));
          numberInput.addEventListener('wheel', (e) => handleWheel(e, index));
        });
      }
      //handle mouse
      document.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        iMouse[0] = (e.clientX - rect.left) * dpr * resolutionScale;
        iMouse[1] = (rect.bottom - e.clientY) * dpr * resolutionScale;

      });
      document.addEventListener('mousedown', (e) => {
        iMouse[2] = 1.0;
      });

      document.addEventListener('mouseup', (e) => {
        iMouse[2] = 0.0;
        iMouse[3] = 1.0;
      });

      document.addEventListener('mouseout', (e) => {
        iMouse[2] = 0.0;
        iMouse[3] = 0.0;
      });
      
      // Touch support for mobile
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        iMouse[0] = (touch.clientX - rect.left) * dpr * resolutionScale;
        iMouse[1] = (rect.bottom - touch.clientY) * dpr * resolutionScale;
        iMouse[2] = 1.0;
      }, { passive: false });
      
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        iMouse[0] = (touch.clientX - rect.left) * dpr * resolutionScale;
        iMouse[1] = (rect.bottom - touch.clientY) * dpr * resolutionScale;
      }, { passive: false });
      
      canvas.addEventListener('touchend', (e) => {
        iMouse[2] = 0.0;
        iMouse[3] = 1.0;
      });
      // Function to handle wheel events
      function handleWheel(event, index) {
        event.preventDefault();
        const delta = event.deltaY > 0 ? -0.1 : 0.1;
        const newValue = Math.min(Math.max(parseFloat(event.target.value) + delta, -2000), 2000);
        updateUniformValue(index, newValue);
        event.target.value = newValue.toFixed(1);
      }

      // Expose handleWheel to global scope
      window.handleWheel = handleWheel;

      // Update the updateUniformValue function
      function updateUniformValue(index, newValue) {
        newValue = parseFloat(newValue).toFixed(1);
        shaderData.uniforms[index].value = parseFloat(newValue);
        
        const uniformDiv = document.querySelectorAll('.uniform')[index];
        const rangeInput = uniformDiv.querySelector('input[type="range"]');
        const numberInput = uniformDiv.querySelector('input[type="number"]');
        
        rangeInput.value = newValue;
        numberInput.value = newValue;
      }

      // Expose updateUniformValue to global scope
      window.updateUniformValue = updateUniformValue;

          // Make modal draggable and resizable
          function makeModalDraggable() {
            const modal = document.getElementById('uniformsModal');
            const header = modal.querySelector('.modal-header');
            const modalContent = modal.querySelector('.modal-content');
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;

            header.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
              initialX = e.clientX - xOffset;
              initialY = e.clientY - yOffset;
              isDragging = true;
            }

            function drag(e) {
              if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                setModalPosition(currentX, currentY);
              }
            }

            function dragEnd(e) {
              initialX = currentX;
              initialY = currentY;
              isDragging = false;
            }

            function setModalPosition(xPos, yPos) {
              modal.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
            }

            // Add resize functionality
            makeModalResizable('uniformsModal');
          }

          // Make modal resizable
          function makeModalResizable(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;

            const modalContent = modal.querySelector('.modal-content');
            if (!modalContent) return;

            // Create resize handles - only bottom-right corner
            const resizeHandles = {
              se: createResizeHandle('se') // bottom-right corner only
            };

            // Add handles to modal content
            Object.values(resizeHandles).forEach(handle => {
              modalContent.appendChild(handle);
            });

            let isResizing = false;
            let resizeType = '';
            let startX = 0;
            let startY = 0;
            let startWidth = 0;
            let startHeight = 0;

            function createResizeHandle(type) {
              const handle = document.createElement('div');
              handle.className = `modal-resize-handle ${type}`;
              handle.dataset.resizeType = type;
              return handle;
            }

            // Add event listeners to all resize handles
            Object.entries(resizeHandles).forEach(([type, handle]) => {
              handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                isResizing = true;
                resizeType = type;
                startX = e.clientX;
                startY = e.clientY;
                startWidth = modalContent.offsetWidth;
                startHeight = modalContent.offsetHeight;

                // Get current position before removing transform
                const rect = modal.getBoundingClientRect();
                const currentLeft = rect.left;
                const currentTop = rect.top;
                
                // Remove transform and set absolute position smoothly
                modal.style.transform = 'none';
                modal.style.left = `${currentLeft}px`;
                modal.style.top = `${currentTop}px`;
                
                // Store the initial position for resize calculations
                modal.dataset.resizeStartLeft = currentLeft;
                modal.dataset.resizeStartTop = currentTop;

                document.addEventListener('mousemove', handleResize);
                document.addEventListener('mouseup', stopResize);
                
                // Prevent text selection during resize
                document.body.style.userSelect = 'none';
              });
            });

            function handleResize(e) {
              if (!isResizing) return;
              
              e.preventDefault();
              
              const deltaX = e.clientX - startX;
              const deltaY = e.clientY - startY;
              
              let newWidth = startWidth;
              let newHeight = startHeight;
              
              // Calculate new dimensions based on resize type
              switch (resizeType) {
                case 'se': // bottom-right corner
                  newWidth = startWidth + deltaX;
                  newHeight = startHeight + deltaY;
                  break;
              }
              
              // Apply minimum and maximum constraints
              const minWidth = 300;
              const minHeight = 200;
              const maxWidth = window.innerWidth * 0.9;
              const maxHeight = window.innerHeight * 0.9;
              
              newWidth = Math.max(minWidth, Math.min(maxWidth, newWidth));
              newHeight = Math.max(minHeight, Math.min(maxHeight, newHeight));
              
              // Apply the new dimensions
              modalContent.style.width = `${newWidth}px`;
              modalContent.style.height = `${newHeight}px`;
              
              // Ensure position stays locked to the stored start position
              const startLeft = parseFloat(modal.dataset.resizeStartLeft);
              const startTop = parseFloat(modal.dataset.resizeStartTop);
              modal.style.left = `${startLeft}px`;
              modal.style.top = `${startTop}px`;
            }

            function stopResize() {
              isResizing = false;
              resizeType = '';
              
              document.removeEventListener('mousemove', handleResize);
              document.removeEventListener('mouseup', stopResize);
              
              // Restore text selection
              document.body.style.userSelect = '';
            }
          }

          // Initialize modal
          updateModalUniformList();
          makeModalDraggable();
          window.addEventListener('resize', () => {
          resizeCanvasToDisplaySize(canvas);
          updateFramebuffers();
        });
      window.onload = () => {
        resizeCanvasToDisplaySize(canvas);
        updateFramebuffers();
      };
      window.addEventListener('keydown', handleKeydown);
      function handleKeydown(event) {
        if (event.ctrlKey) {
          switch (event.key) {
            case 's':
              event.preventDefault();
              saveState();
              break;
            case 'e':
              event.preventDefault();
              resizeCanvasToDisplaySize(canvas);
              updateFramebuffers();
              break;
            case 'r':
              event.preventDefault();
              resetFrameTime();

              break;
          }
        }
      }
      function resetFrameTime() {
        iFrame = 0;
      }
    }

    main();
    
  </script>
</body>
</html>
