<head>
  <title>ShaderKit - Shader Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin: 0; overflow: hidden; background-color: #2c3e50; font-family: Arial, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
    .modal {
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
    }
    .modal-content {
      width: 300px;
    }
    .modal-header {
      cursor: move;
      padding: 5px;
      background-color: rgba(255, 255, 255, 0.1);
      margin-bottom: 5px;
    }
    .modal-footer {
      padding: 5px;
    }
    #channelSelectContainer {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 1px;
    }
    #channelSelectContainer select {
      width: 45%;
    }
    .uniform {
      margin-bottom: -8px;
    }
    .uniform input[type="range"] {
      width: 80%;
    }
    .uniform input[type="number"] {
      width: 40px;
      -moz-appearance: textfield;
      -webkit-appearance: textfield;
    }
  </style>

  <script>
    const shaderData = {"channels":{"iChannel0":"// Sacred Geometry - Flower of Life pattern with sacred geometry principles\n// Overlapping circles creating the ancient pattern\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;\n    float t = iTime * 0.1;\n    \n    // Scale\n    uv *= 4.0;\n    \n    // Flower of Life grid parameters\n    vec2 r = vec2(1.0, 0.866); // 2:sqrt(3) ratio\n    float radius = 0.5;\n    \n    vec3 col = vec3(0.02, 0.02, 0.03);\n    \n    // Create multiple layers of overlapping circles\n    for(int ring = 0; ring <= 3; ring++) {\n        float fi = float(ring);\n        \n        // Number of points in this ring\n        int count = ring == 0 ? 1 : ring * 6;\n        \n        for(int i = 0; i < 18; i++) {\n            if(i >= count && ring > 0) break;\n            \n            // Calculate position\n            vec2 pos;\n            if(ring == 0) {\n                pos = vec2(0.0);\n            } else {\n                float angle = (6.28318 / float(count)) * float(i) + fi * 0.1;\n                float dist = radius * 2.0 * fi;\n                pos = vec2(cos(angle), sin(angle)) * dist;\n            }\n            \n            // Animate position\n            pos += vec2(sin(t + fi), cos(t * 0.7 + fi)) * 0.05;\n            \n            // Distance to this circle center\n            float d = length(uv - pos);\n            \n            // Circle outline\n            float circle = smoothstep(0.03, 0.01, abs(d - radius));\n            \n            // Color by ring\n            float hue = fract(fi * 0.1 + t * 0.2 + float(i) * 0.02);\n            vec3 circleCol = 0.5 + 0.5 * cos(vec3(0.0, 2.09, 4.18) + hue * 3.0);\n            \n            col += circleCol * circle * 0.4;\n            \n            // Glow at intersection points\n            float glow = 1.0 / (1.0 + d * d * 20.0) * smoothstep(radius * 2.5, 0.0, d);\n            col += circleCol * glow * 0.15;\n        }\n    }\n    \n    // Central glow\n    float centerGlow = 1.0 / (1.0 + length(uv) * length(uv) * 2.0);\n    col += vec3(1.0, 0.9, 0.7) * centerGlow * 0.5;\n    \n    // Vignette\n    float vignette = 1.0 - length((fragCoord - 0.5 * iResolution.xy) / iResolution.xy) * 0.5;\n    col *= vignette;\n    \n    // Tone map\n    col = col / (1.0 + col * 0.5);\n    col = pow(col, vec3(0.95));\n    \n    fragColor = vec4(col, 1.0);\n}\n","displayMode":"void mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    vec2 uv = fragCoord.xy / iResolution.xy;\n    vec3 col = texture(iChannel0, uv).rgb;\n    fragColor = vec4(col, 1.);\n}","iChannel1":"void mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    vec2 uv = fragCoord.xy / iResolution.xy;\n    vec3 col = vec3(uv, 0.5 + 0.5*sin(iTime));\n    col += texture(iChannel0, uv).rgb;\n    fragColor = vec4(col, 1.0);\n}"},"uniforms":[],"commonCode":"#define pi acos(-1.)\n#define deg pi/180.\n#define time iTime*2.*pi/10.\n#define R iResolution.xy\n#define ar R.x/R.y\n#define M iMouse\n#define xm (M.xy/R)\n#define nm ((xm.xy-0.5)*vec2(ar,1.)+0.5)\nmat2 r2d(float a) {\n    return mat2(cos(a),sin(a),-sin(a),cos(a));\n}","displayCode":"Not used","availableChannels":["iChannel0"],"thumbnailUrl":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAYAAAA8AXHiAAAQAElEQVR4AaT9B7xtWXbWh35jrb1PPveee26unKsrdnWoDtW5JcyzMQ9sbPPAJgkwEsiSLEs2FhLCgDH2A+RAkmTxEPbPz/DjYWwwPCx1rM65u6pD5Vx1czr35L3Xev9vzLX22efeKsLvrTu/OeIcM40919pr37pVLRw+1i6sHm0XDh1pF1YOg9V28eChggPQAyvtYoel9/9wu3TT7Skvoetx6J4Pt4cf+jfbww//m+2hO9/bLh861i7Tdpk4Bavt8sH9OICcWDnSHrrl4fbo2//v7dFHfkd79KHf1h48fEN7YGW1PTiFo/d8tD3+8O9Ed7g9yFhXEkfbldVj4Hi7cvgEONkeOnJDe+joTeDmdvXYre3q8Tva1RN3tYdP3tMevuFt7eEb7wP3d4C37gZsJ+/ED9/jt7Wrx25pV4mxevTGdvUIMYl96PDxNkF/hxJHkY+1J9/xu9qbHv0D7Q0P/vb2EOtYcAzecJsT7aHDjgGOEC/jEv8Y/Xhsx+9sD5+4uz188l7A+E4WrCKvol/FfujY7czn1vbQkZuZ443ghnZl9QTrcBwcaw+uHAVHWLPD7YGDxmq7euPb2+MP/I72gPfhOqy0y+xfj9zH5ZV26VrQbqnDIrY9HGwXlzssQQ36Pfj2/1u7dPKudmFppa2UV5t1UBuQ68t     const canvas = document.getElementById('canvas');
    
    function main() {
      const gl = canvas.getContext('webgl2');

      if (!gl) {
        alert('WebGL 2 not supported');
        return;
      }

      // Enable required extensions
      gl.getExtension('EXT_color_buffer_float');
      gl.getExtension('OES_texture_float_linear');

      const vertexShaderSource = `#version 300 es
        in vec4 position;
        void main() {
          gl_Position = position;
        }
      `;

      function getFragmentShaderSource(channel) {
        return `#version 300 es
          precision highp float;
          uniform vec2 iResolution;
          uniform float iTime;
          uniform int iFrame;
          uniform vec4 iMouse;
          uniform sampler2D iChannel0;\nuniform sampler2D displayMode;\nuniform sampler2D iChannel1;
          
          out vec4 fragColor;
          void mainImage(out vec4 fragColor, in vec2 fragCoord);
          #define pi acos(-1.)
#define deg pi/180.
#define time iTime*2.*pi/10.
#define R iResolution.xy
#define ar R.x/R.y
#define M iMouse
#define xm (M.xy/R)
#define nm ((xm.xy-0.5)*vec2(ar,1.)+0.5)
mat2 r2d(float a) {
    return mat2(cos(a),sin(a),-sin(a),cos(a));
}
          void main() {
            mainImage(fragColor, gl_FragCoord.xy);
          }
          ${shaderData.channels[channel]}
        `;
      }

      function compileShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      }

      function createProgram(gl, vertexShader, fragmentShader) {
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error('Program linking error:', gl.getProgramInfoLog(program));
          gl.deleteProgram(program);
          return null;
        }
        return program;
      }

      const vertexShader = compileShader(gl, gl.VERTEX_SHADER, vertexShaderSource);

      const programs = {};
      Object.keys(shaderData.channels).forEach(channel => {
        const fragmentShaderSource = getFragmentShaderSource(channel);
        const fragmentShader = compileShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
        programs[channel] = createProgram(gl, vertexShader, fragmentShader);
      });

      const positionBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

      const framebuffers = {};
      const textures = {};

      function createFramebufferTexture(width, height) {
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, width, height, 0, gl.RGBA, gl.FLOAT, null);
        // Use shader data texture filtering settings (from embedded shaderData)
        const magFilter = (shaderData.magFilter === 'NEAREST') ? gl.NEAREST : gl.LINEAR;
        const minFilter = (shaderData.minFilter === 'NEAREST') ? gl.NEAREST : gl.LINEAR;
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, minFilter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, magFilter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        
        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        if (status !== gl.FRAMEBUFFER_COMPLETE) {
          console.error('Framebuffer is not complete:', status);
        }
        
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return { texture, framebuffer: fb };
      }

      // Use scale from shader data (defaults to 1 for older exports)
      const resolutionScale = shaderData.resolutionScale || 1;
      let lastWidth = 0;
      let lastHeight = 0;

      function resizeCanvasToDisplaySize(canvas) {
        const displayWidth = Math.floor(canvas.clientWidth * window.devicePixelRatio * resolutionScale);
        const displayHeight = Math.floor(canvas.clientHeight * window.devicePixelRatio * resolutionScale);
        const needResize = canvas.width !== displayWidth || canvas.height !== displayHeight;
        if (needResize) {
            canvas.width = displayWidth;
            canvas.height = displayHeight;
            lastWidth = displayWidth;
            lastHeight = displayHeight;
          }
          return needResize;
      }

      function updateFramebuffers() {
        Object.keys(shaderData.channels).forEach(channel => {
          framebuffers[channel] = [
            createFramebufferTexture(canvas.width, canvas.height),
            createFramebufferTexture(canvas.width, canvas.height)
          ];
          textures[channel] = framebuffers[channel].map(fb => fb.texture);
        });
      }

      let currentBufferIndex = 0;
      let iFrame = 0;
      let iMouse = [0.0, 0.0, 0.0, 0.0];

      function render(time) {
        // Check if resize is needed and update framebuffers if so
        if (resizeCanvasToDisplaySize(canvas)) {
          updateFramebuffers();
          // Reset buffer index on resize to prevent drift
          currentBufferIndex = 0;
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
        
        Object.keys(shaderData.channels).forEach(channel => {
          const program = programs[channel];
          if (!program) return;
          
          gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffers[channel][1 - currentBufferIndex].framebuffer);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.useProgram(program);
          
          setUniforms(program, time);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        });

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.clear(gl.COLOR_BUFFER_BIT);
        const displayModeProgram = programs.displayMode;
        gl.useProgram(displayModeProgram);
        
        setUniforms(displayModeProgram, time);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        iFrame++;
        currentBufferIndex = 1 - currentBufferIndex;
        requestAnimationFrame(render);
      }

      function setUniforms(program, time) {
        gl.uniform2f(gl.getUniformLocation(program, 'iResolution'), canvas.width, canvas.height);
        gl.uniform1f(gl.getUniformLocation(program, 'iTime'), time * 0.001);
        gl.uniform1i(gl.getUniformLocation(program, 'iFrame'), iFrame);
        gl.uniform4f(gl.getUniformLocation(program, 'iMouse'), iMouse[0], iMouse[1], iMouse[2], iMouse[3]);
        
        Object.keys(shaderData.channels).forEach((channel, index) => {
          const loc = gl.getUniformLocation(program, channel);
          if (loc !== null) {
            gl.uniform1i(loc, index);
            gl.activeTexture(gl.TEXTURE0 + index);
            gl.bindTexture(gl.TEXTURE_2D, textures[channel][currentBufferIndex]);
          }
        });
        
        shaderData.uniforms.forEach(uniform => {
          const loc = gl.getUniformLocation(program, uniform.name);
          if (loc !== null) {
            gl.uniform1f(loc, uniform.value);
          }
        });
      }

      const positionAttributeLocation = gl.getAttribLocation(programs.displayMode, 'position');
      gl.enableVertexAttribArray(positionAttributeLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionAttributeLocation, 2, gl.FLOAT, false, 0, 0);

      updateFramebuffers();
      requestAnimationFrame(render);

      // Initial setup - render loop handles resize
      resizeCanvasToDisplaySize(canvas);
      updateFramebuffers();

      // Function to update modal uniform list
      function updateModalUniformList() {
        const modalUniformList = document.getElementById('modalUniformList');
        modalUniformList.innerHTML = '';
        const uniformsModal = document.getElementById('uniformsModal');
        if (shaderData.uniforms.length > 0) {
          uniformsModal.style.display = 'block';
        }
        shaderData.uniforms.forEach((uniform, index) => {
          const uniformDiv = document.createElement('div');
          uniformDiv.classList.add('uniform');
          // Security: HTML escaping function to prevent XSS
          function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
          }
          
          // Security: Escape uniform name and value to prevent XSS
          const escapedName = escapeHtml(String(uniform.name || ''));
          const escapedValue = escapeHtml(String(uniform.value || 0));
          uniformDiv.innerHTML = `
            <span style="padding-right: 200px;">${escapedName}</span>
            <input type="range" min="-20" max="20" step="0.1" value="${escapedValue}" oninput="updateUniformValue(${index}, this.value)">
            <input type="number" min="-20" max="20" step="0.1" value="${escapedValue}" oninput="updateUniformValue(${index}, this.value)">
          `;
          modalUniformList.appendChild(uniformDiv);

          const rangeInput = uniformDiv.querySelector('input[type="range"]');
          const numberInput = uniformDiv.querySelector('input[type="number"]');

          // Add wheel event listeners
          rangeInput.addEventListener('wheel', (e) => handleWheel(e, index));
          numberInput.addEventListener('wheel', (e) => handleWheel(e, index));
        });
      }
      //handle mouse
      document.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        iMouse[0] = (e.clientX - rect.left) * dpr * resolutionScale;
        iMouse[1] = (rect.bottom - e.clientY) * dpr * resolutionScale;

      });
      document.addEventListener('mousedown', (e) => {
        iMouse[2] = 1.0;
      });

      document.addEventListener('mouseup', (e) => {
        iMouse[2] = 0.0;
        iMouse[3] = 1.0;
      });

      document.addEventListener('mouseout', (e) => {
        iMouse[2] = 0.0;
        iMouse[3] = 0.0;
      });
      
      // Touch support for mobile
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        iMouse[0] = (touch.clientX - rect.left) * dpr * resolutionScale;
        iMouse[1] = (rect.bottom - touch.clientY) * dpr * resolutionScale;
        iMouse[2] = 1.0;
      }, { passive: false });
      
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        iMouse[0] = (touch.clientX - rect.left) * dpr * resolutionScale;
        iMouse[1] = (rect.bottom - touch.clientY) * dpr * resolutionScale;
      }, { passive: false });
      
      canvas.addEventListener('touchend', (e) => {
        iMouse[2] = 0.0;
        iMouse[3] = 1.0;
      });
      // Function to handle wheel events
      function handleWheel(event, index) {
        event.preventDefault();
        const delta = event.deltaY > 0 ? -0.1 : 0.1;
        const newValue = Math.min(Math.max(parseFloat(event.target.value) + delta, -2000), 2000);
        updateUniformValue(index, newValue);
        event.target.value = newValue.toFixed(1);
      }

      // Expose handleWheel to global scope
      window.handleWheel = handleWheel;

      // Update the updateUniformValue function
      function updateUniformValue(index, newValue) {
        newValue = parseFloat(newValue).toFixed(1);
        shaderData.uniforms[index].value = parseFloat(newValue);
        
        const uniformDiv = document.querySelectorAll('.uniform')[index];
        const rangeInput = uniformDiv.querySelector('input[type="range"]');
        const numberInput = uniformDiv.querySelector('input[type="number"]');
        
        rangeInput.value = newValue;
        numberInput.value = newValue;
      }

      // Expose updateUniformValue to global scope
      window.updateUniformValue = updateUniformValue;

          // Make modal draggable and resizable
          function makeModalDraggable() {
            const modal = document.getElementById('uniformsModal');
            const header = modal.querySelector('.modal-header');
            const modalContent = modal.querySelector('.modal-content');
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;

            header.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            function dragStart(e) {
              initialX = e.clientX - xOffset;
              initialY = e.clientY - yOffset;
              isDragging = true;
            }

            function drag(e) {
              if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                setModalPosition(currentX, currentY);
              }
            }

            function dragEnd(e) {
              initialX = currentX;
              initialY = currentY;
              isDragging = false;
            }

            function setModalPosition(xPos, yPos) {
              modal.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
            }

            // Add resize functionality
            makeModalResizable('uniformsModal');
          }

          // Make modal resizable
          function makeModalResizable(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;

            const modalContent = modal.querySelector('.modal-content');
            if (!modalContent) return;

            // Create resize handles - only bottom-right corner
            const resizeHandles = {
              se: createResizeHandle('se') // bottom-right corner only
            };

            // Add handles to modal content
            Object.values(resizeHandles).forEach(handle => {
              modalContent.appendChild(handle);
            });

            let isResizing = false;
            let resizeType = '';
            let startX = 0;
            let startY = 0;
            let startWidth = 0;
            let startHeight = 0;

            function createResizeHandle(type) {
              const handle = document.createElement('div');
              handle.className = `modal-resize-handle ${type}`;
              handle.dataset.resizeType = type;
              return handle;
            }

            // Add event listeners to all resize handles
            Object.entries(resizeHandles).forEach(([type, handle]) => {
              handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                isResizing = true;
                resizeType = type;
                startX = e.clientX;
                startY = e.clientY;
                startWidth = modalContent.offsetWidth;
                startHeight = modalContent.offsetHeight;

                // Get current position before removing transform
                const rect = modal.getBoundingClientRect();
                const currentLeft = rect.left;
                const currentTop = rect.top;
                
                // Remove transform and set absolute position smoothly
                modal.style.transform = 'none';
                modal.style.left = `${currentLeft}px`;
                modal.style.top = `${currentTop}px`;
                
                // Store the initial position for resize calculations
                modal.dataset.resizeStartLeft = currentLeft;
                modal.dataset.resizeStartTop = currentTop;

                document.addEventListener('mousemove', handleResize);
                document.addEventListener('mouseup', stopResize);
                
                // Prevent text selection during resize
                document.body.style.userSelect = 'none';
              });
            });

            function handleResize(e) {
              if (!isResizing) return;
              
              e.preventDefault();
              
              const deltaX = e.clientX - startX;
              const deltaY = e.clientY - startY;
              
              let newWidth = startWidth;
              let newHeight = startHeight;
              
              // Calculate new dimensions based on resize type
              switch (resizeType) {
                case 'se': // bottom-right corner
                  newWidth = startWidth + deltaX;
                  newHeight = startHeight + deltaY;
                  break;
              }
              
              // Apply minimum and maximum constraints
              const minWidth = 300;
              const minHeight = 200;
              const maxWidth = window.innerWidth * 0.9;
              const maxHeight = window.innerHeight * 0.9;
              
              newWidth = Math.max(minWidth, Math.min(maxWidth, newWidth));
              newHeight = Math.max(minHeight, Math.min(maxHeight, newHeight));
              
              // Apply the new dimensions
              modalContent.style.width = `${newWidth}px`;
              modalContent.style.height = `${newHeight}px`;
              
              // Ensure position stays locked to the stored start position
              const startLeft = parseFloat(modal.dataset.resizeStartLeft);
              const startTop = parseFloat(modal.dataset.resizeStartTop);
              modal.style.left = `${startLeft}px`;
              modal.style.top = `${startTop}px`;
            }

            function stopResize() {
              isResizing = false;
              resizeType = '';
              
              document.removeEventListener('mousemove', handleResize);
              document.removeEventListener('mouseup', stopResize);
              
              // Restore text selection
              document.body.style.userSelect = '';
            }
          }

          // Initialize modal
          updateModalUniformList();
          makeModalDraggable();
          window.addEventListener('resize', () => {
          resizeCanvasToDisplaySize(canvas);
          updateFramebuffers();
        });
      window.onload = () => {
        resizeCanvasToDisplaySize(canvas);
        updateFramebuffers();
      };
      window.addEventListener('keydown', handleKeydown);
      function handleKeydown(event) {
        if (event.ctrlKey) {
          switch (event.key) {
            case 's':
              event.preventDefault();
              saveState();
              break;
            case 'e':
              event.preventDefault();
              resizeCanvasToDisplaySize(canvas);
              updateFramebuffers();
              break;
            case 'r':
              event.preventDefault();
              resetFrameTime();

              break;
          }
        }
      }
      function resetFrameTime() {
        iFrame = 0;
      }
    }

    main();
    
  </script>
</body>
